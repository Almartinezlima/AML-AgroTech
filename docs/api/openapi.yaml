openapi: 3.0.3
info:
  title: AML AgroTech API
  version: 1.0.0
  description: |
    API REST de AML AgroTech. Las respuestas correctas son `{ data }` y los errores `{ error: { codigo, mensaje } }`.
    La sesión viaja en las cookies de Supabase Auth: inicia sesión en la web antes de probar las rutas protegidas.
servers:
  - url: /api
tags:
  - name: Salud
  - name: Usuarios
  - name: Catálogo
  - name: Pedidos
  - name: Pagos
  - name: Inventario
  - name: Panel
  - name: Abastecimiento
    description: Proveedores mayoristas (rol distribuidor) y sus presentaciones
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: sb-auth-token
  responses:
    Error:
      description: Error con el formato de la API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Pruebas:
      name: pruebas
      in: query
      description: '`1` incluye los datos de las cuentas de prueba E2E (@amlagrotech.test). Por defecto se ocultan.'
      schema: { type: string, enum: ['0', '1'] }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string, example: NO_AUTENTICADO }
            mensaje: { type: string, example: Debes iniciar sesión. }
            detalle: { type: object }
    Rol: { type: string, enum: [admin, cliente, distribuidor] }
    EstadoPedido: { type: string, enum: [pendiente, confirmado, preparando, listo_para_recoger, despachado, entregado, cancelado], description: 'Recojo en tienda usa listo_para_recoger en vez de despachado (migración 0007)' }
    MetodoPago: { type: string, enum: [qr, transferencia, contra_entrega] }
    ProductoEntrada:
      type: object
      required: [nombre, precio, stock_minimo, unidad, categoria_id]
      properties:
        sku: { type: string, nullable: true }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        precio: { type: number, minimum: 0.01 }
        stock_minimo: { type: integer, minimum: 0 }
        unidad: { type: string, example: bolsa }
        categoria_id: { type: string, format: uuid }
        icono: { type: string }
        imagen_url: { type: string, format: uri, nullable: true }
        composicion: { type: string, nullable: true, maxLength: 200, description: 'Ingrediente activo o N-P-K', example: 'N-P-K 18-46-0' }
        cultivos: { type: string, nullable: true, maxLength: 300 }
        modo_uso: { type: string, nullable: true, maxLength: 1000 }
        dosis: { type: string, nullable: true, maxLength: 300 }
        banda_toxicologica: { $ref: '#/components/schemas/BandaToxicologica' }
        precio_referencia: { type: number, minimum: 0.01, nullable: true, description: 'Precio de referencia de mercado (no es el precio de venta)' }
        fuente_precio: { type: string, nullable: true, maxLength: 150, example: 'SurtiAgro, mercado de Santa Cruz' }
        fecha_precio: { type: string, format: date, nullable: true, example: '2026-09-07' }
        tendencia_precio: { $ref: '#/components/schemas/TendenciaPrecio' }
    BandaToxicologica:
      type: string
      nullable: true
      enum: [roja, amarilla, azul, verde, null]
      description: Solo productos de la categoría Agroquímicos (la base lo exige con un trigger; si no, 422)
    TendenciaPrecio:
      type: string
      nullable: true
      enum: [al_alza, estable, a_la_baja, null]
      description: Tendencia del mercado, no de nuestro precio
    Producto:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, nullable: true, example: AGR-012 }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        precio: { type: number }
        stock: { type: integer }
        stock_minimo: { type: integer }
        unidad: { type: string, example: saco 50kg }
        categoria_id: { type: string, format: uuid, nullable: true }
        icono: { type: string, nullable: true }
        imagen_url: { type: string, nullable: true }
        activo: { type: boolean }
        composicion: { type: string, nullable: true, maxLength: 200, description: 'Ingrediente activo o N-P-K', example: 'N-P-K 18-46-0' }
        cultivos: { type: string, nullable: true, maxLength: 300 }
        modo_uso: { type: string, nullable: true, maxLength: 1000 }
        dosis: { type: string, nullable: true, maxLength: 300 }
        banda_toxicologica: { $ref: '#/components/schemas/BandaToxicologica' }
        precio_referencia: { type: number, minimum: 0.01, nullable: true, description: 'Precio de referencia de mercado (no es el precio de venta)' }
        fuente_precio: { type: string, nullable: true, maxLength: 150, example: 'SurtiAgro, mercado de Santa Cruz' }
        fecha_precio: { type: string, format: date, nullable: true, example: '2026-09-07' }
        tendencia_precio: { $ref: '#/components/schemas/TendenciaPrecio' }
        categorias:
          type: object
          nullable: true
          properties:
            nombre: { type: string }
            icono: { type: string }
    ZonaEntrada:
      type: object
      required: [nombre, tipo, costo, dias_min, dias_max, permite_contra_entrega]
      properties:
        nombre: { type: string }
        tipo: { type: string, enum: [recojo, urbano, provincia] }
        costo: { type: number, minimum: 0 }
        dias_min: { type: integer, minimum: 0 }
        dias_max: { type: integer, minimum: 0 }
        permite_contra_entrega: { type: boolean }
        orden: { type: integer }
    ItemPedido:
      type: object
      required: [producto_id, cantidad]
      properties:
        producto_id: { type: string, format: uuid }
        cantidad: { type: integer, minimum: 1 }
    PedidoEntrada:
      type: object
      required: [items, zona_id, telefono, metodo_pago]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ItemPedido' } }
        zona_id: { type: string, format: uuid }
        direccion: { type: string, nullable: true, description: Obligatoria para la entrega en el pueblo }
        recoge_nombre: { type: string, nullable: true, description: 'Zonas por flota: nombre de quien recoge la encomienda (3 a 100 caracteres)' }
        recoge_ci: { type: string, nullable: true, example: '1234567', description: 'Zonas por flota: CI de quien recoge (5 a 10 dígitos, complemento opcional)' }
        telefono: { type: string, example: '70000000' }
        metodo_pago: { $ref: '#/components/schemas/MetodoPago' }
        notas: { type: string, nullable: true }
    DistribuidorEntrada:
      type: object
      required: [usuario_id, nombre_comercial, ciudad, dias_entrega]
      properties:
        usuario_id: { type: string, format: uuid, description: 'Cuenta con rol distribuidor (solo al crear; no se cambia)' }
        nombre_comercial: { type: string, minLength: 2, maxLength: 120 }
        ciudad: { type: string, enum: [Sucre, Santa Cruz] }
        telefono: { type: string, nullable: true, example: '70012345' }
        nit: { type: string, nullable: true }
        dias_entrega: { type: integer, minimum: 0, maximum: 60 }
        activo: { type: boolean, description: Solo al editar }
    PresentacionEntrada:
      type: object
      required: [producto_id, nombre, unidades_por_presentacion, precio_mayorista, disponible, dias_entrega]
      properties:
        producto_id: { type: string, format: uuid, description: 'Producto de la tienda (solo al crear; no se cambia)' }
        nombre: { type: string, example: 'Bidón 20 L' }
        unidades_por_presentacion: { type: integer, minimum: 1, example: 20, description: 'Unidades de venta de la tienda que trae (fraccionamiento)' }
        precio_mayorista: { type: number, exclusiveMinimum: 0, example: 1640 }
        disponible: { type: boolean }
        dias_entrega: { type: integer, nullable: true, minimum: 0, maximum: 60, description: 'null = los de la ficha' }
        activo: { type: boolean, description: 'Solo al editar: false = dejar de venderla (no se borra)' }
security: []
paths:
  /salud:
    get:
      tags: [Salud]
      summary: Estado de la aplicación y la base
      responses:
        '200': { description: Todo responde }
        '503': { $ref: '#/components/responses/Error' }
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Pruebas' }]
      responses:
        '200': { description: Lista de usuarios }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /usuarios/{id}:
    patch:
      tags: [Usuarios]
      summary: Cambiar rol o estado (admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rol: { $ref: '#/components/schemas/Rol' }
                activo: { type: boolean }
      responses:
        '200': { description: Usuario actualizado }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /productos:
    get:
      tags: [Catálogo]
      summary: Listar productos
      parameters:
        - { name: alcance, in: query, schema: { type: string, enum: [activos, todos] }, description: "`todos` requiere admin" }
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Producto' } }
    post:
      tags: [Inventario]
      summary: Crear producto (admin). Nace con stock 0
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '201': { description: Producto creado }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /productos/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Catálogo]
      summary: Detalle de un producto
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Producto' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Inventario]
      summary: Editar producto (admin). No permite cambiar el stock
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '200': { description: Producto actualizado }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /productos/imagen:
    post:
      tags: [Inventario]
      summary: Subir imagen de producto (admin, jpg/png/webp, máx. 2 MB)
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201': { description: URL pública de la imagen }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /categorias:
    get:
      tags: [Catálogo]
      summary: Listar categorías
      responses:
        '200': { description: Lista de categorías }
  /zonas-envio:
    get:
      tags: [Catálogo]
      summary: Listar zonas de envío
      parameters:
        - { name: alcance, in: query, schema: { type: string, enum: [activas, todas] }, description: "`todas` requiere admin" }
      responses:
        '200': { description: Lista de zonas }
    post:
      tags: [Catálogo]
      summary: Crear zona (admin)
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonaEntrada' }
      responses:
        '201': { description: Zona creada }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /zonas-envio/{id}:
    patch:
      tags: [Catálogo]
      summary: Editar zona (admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonaEntrada' }
      responses:
        '200': { description: Zona actualizada }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos
      security: [{ sesion: [] }]
      parameters:
        - { name: alcance, in: query, schema: { type: string, enum: [propios, todos] }, description: "`todos` requiere admin" }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoPedido' } }
        - { $ref: '#/components/parameters/Pruebas' }
      responses:
        '200': { description: Lista de pedidos }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Pedidos]
      summary: Crear pedido. Precios y total los calcula la base
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoEntrada' }
      responses:
        '201': { description: Pedido creado con su código }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pedidos/ultima-entrega:
    get:
      tags: [Pedidos]
      summary: Datos de entrega del último pedido propio (para rellenar el checkout)
      description: 'Solo pedidos del usuario de la sesión. Devuelve zona (solo si sigue activa), dirección, teléfono y quién recoge en flota; data es null si todavía no tiene pedidos (fase 4).'
      security: [{ sesion: [] }]
      responses:
        '200':
          description: Datos de la última entrega, o null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    type: object
                    properties:
                      zona_id: { type: string, format: uuid, nullable: true }
                      direccion: { type: string, nullable: true }
                      telefono: { type: string, nullable: true }
                      recoge_nombre: { type: string, nullable: true }
                      recoge_ci: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
  /pedidos/cotizar:
    post:
      tags: [Pedidos]
      summary: Calcular el total con precios reales, sin crear nada
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, zona_id]
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/ItemPedido' } }
                zona_id: { type: string, format: uuid }
      responses:
        '200': { description: Cotización }
        '409': { $ref: '#/components/responses/Error' }
  /pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Detalle con items, pago, envío y seguimiento (dueño o admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Pedido }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /pedidos/{id}/cancelar:
    post:
      tags: [Pedidos]
      summary: Cancelar pedido y devolver el stock
      description: 'Cliente: solo si el pedido y el pago siguen pendientes (sin comprobante). Admin: pedidos pendientes o confirmados; si el pago estaba verificado o en revisión pasa a reembolso_pendiente (migración 0006).'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string, nullable: true }
      responses:
        '200': { description: Pedido cancelado }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /pedidos/{id}/anular-prueba:
    post:
      tags: [Pedidos]
      summary: Anular un pedido de prueba E2E (admin)
      description: 'Solo pedidos de cuentas @amlagrotech.test. Cancela en cualquier estado (también entregado), devuelve el stock con su devolución en el kardex y cierra el pago como reembolsado. Si ya estaba cancelado no devuelve stock otra vez (migración 0011).'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Pedido anulado }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /pedidos/{id}/estado:
    patch:
      tags: [Pedidos]
      summary: Avanzar el estado del pedido (admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoPedido' }
                nota: { type: string, nullable: true }
                transportista: { type: string, nullable: true }
                numero_guia: { type: string, nullable: true }
      responses:
        '200': { description: Estado actualizado }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pagos:
    get:
      tags: [Pagos]
      summary: Listar pagos con comprobante firmado (admin)
      security: [{ sesion: [] }]
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [pendiente, en_revision, verificado, rechazado, reembolso_pendiente, reembolsado] } }
        - { $ref: '#/components/parameters/Pruebas' }
      responses:
        '200': { description: Lista de pagos }
        '403': { $ref: '#/components/responses/Error' }
  /pagos/{id}/comprobante:
    post:
      tags: [Pagos]
      summary: Subir comprobante. El id es el del pedido (dueño, jpg/png/webp/pdf, máx. 3 MB)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201': { description: Pago en revisión }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pagos/{id}/reembolso:
    post:
      tags: [Pagos]
      summary: Marcar como devuelto un pago en reembolso pendiente (admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nota: { type: string, nullable: true, maxLength: 300 }
      responses:
        '200': { description: Pago reembolsado }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /pagos/{id}/verificar:
    patch:
      tags: [Pagos]
      summary: Aprobar o rechazar un pago (admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprobado]
              properties:
                aprobado: { type: boolean }
                motivo: { type: string, nullable: true, description: Obligatorio al rechazar }
      responses:
        '200': { description: Pago revisado }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /inventario/movimientos:
    get:
      tags: [Inventario]
      summary: Kardex (admin)
      security: [{ sesion: [] }]
      parameters:
        - { name: producto, in: query, schema: { type: string, format: uuid } }
        - { name: formato, in: query, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: Movimientos en JSON o CSV }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Inventario]
      summary: Registrar entrada o ajuste (admin)
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [producto_id, tipo, cantidad, motivo]
              properties:
                producto_id: { type: string, format: uuid }
                tipo: { type: string, enum: [entrada, ajuste] }
                cantidad: { type: integer, description: En un ajuste, negativa resta }
                motivo: { type: string }
      responses:
        '201': { description: Movimiento registrado }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      tags: [Panel]
      summary: Resumen del negocio (admin)
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Pruebas' }]
      responses:
        '200': { description: Ventas, pedidos, stock bajo, pagos e inventario }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /distribuidores:
    get:
      tags: [Abastecimiento]
      summary: Fichas de proveedores con sus presentaciones y cuentas sin ficha (admin)
      security: [{ sesion: [] }]
      responses:
        '200': { description: '{ distribuidores, cuentas_sin_ficha }' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Abastecimiento]
      summary: Crear la ficha de una cuenta con rol distribuidor (admin)
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DistribuidorEntrada' }
      responses:
        '201': { description: Ficha creada }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /distribuidores/{id}:
    patch:
      tags: [Abastecimiento]
      summary: Editar o desactivar una ficha (admin)
      security: [{ sesion: [] }]
