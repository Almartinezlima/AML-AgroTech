        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /entregas/{id}:
    get:
      tags: [Entrega]
      summary: Datos para entregar un pedido (repartidor que la aceptó o admin)
      description: 'Repartidor: solo las entregas que aceptó (listas para salir o en camino). Admin: cualquiera. Trae lo que gana, quién la lleva, si el código está bloqueado y los intentos que quedan; nunca el código (función detalle_entrega).'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Datos de la entrega }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /entregas/{id}/tomar:
    post:
      tags: [Entrega]
      summary: Recogí el pedido (repartidor que la aceptó o admin)
      description: 'Listo para salir (empacado) a despachado, a domicilio. Solo quien aceptó la entrega (403 si es de otro). Registra quién lo lleva y cuándo salió de la tienda.'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Pedido en camino }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /entregas/{id}/entregar:
    post:
      tags: [Entrega]
      summary: Entregar con el código de 4 dígitos del cliente
      description: 'Repartidor (domicilio, el que lo recogió) o admin (recojo en tienda y domicilio). El pago QR ya está verificado: el pedido queda completado. Código incorrecto: 422 CODIGO_INCORRECTO con detalle.intentos_restantes; al quinto intento, 409 CODIGO_BLOQUEADO.'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, nombre]
              properties:
                codigo: { type: string, pattern: '^[0-9]{4}$' }
                nombre: { type: string, minLength: 3, maxLength: 120, description: Quien recibe }
                ci: { type: string, minLength: 4, maxLength: 20, nullable: true }
      responses:
        '200': { description: 'Entregado (estado entregado o completado)' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /entregas/{id}/desbloquear:
    post:
      tags: [Entrega]
      summary: Desbloquear un código de entrega (admin)
      description: 'Solo con el código bloqueado por 5 intentos fallidos. La nota queda en la línea de tiempo.'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nota]
              properties:
                nota: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200': { description: Código desbloqueado }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pedidos/{id}/recibido:
    post:
      tags: [Entrega]
      summary: 'Por flota: Recibí mi pedido (dueño) o confirmación con nota (admin)'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nota: { type: string, maxLength: 300, nullable: true, description: 'Obligatoria para el admin (3 a 300)' }
      responses:
        '200': { description: 'Entregado (y completado si el pago está verificado)' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pedidos/{id}/calificacion:
    post:
      tags: [Entrega]
      summary: 'Recibí conforme: calificar la entrega (dueño, una vez)'
      security: [{ sesion: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estrellas]
              properties:
                estrellas: { type: integer, minimum: 1, maximum: 5 }
                comentario: { type: string, maxLength: 200, nullable: true }
      responses:
        '201': { description: Calificación guardada }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /calificaciones:
    get:
      tags: [Entrega]
      summary: Resumen de calificaciones de entrega (admin)
      description: 'Promedio, cantidad, bajas (1 o 2 estrellas) y las 10 últimas con el código del pedido y el cliente.'
      security: [{ sesion: [] }]
      responses:
        '200': { description: Resumen }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
